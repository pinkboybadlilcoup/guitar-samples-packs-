<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PinkBoy & Badlilcoup Archives</title>


<style>

*{
    box-sizing:border-box;
}


body{

    margin:0;
    background:#050505;
    color:white;
    font-family:Arial, Helvetica, sans-serif;

}



/* MAIN LANDING PAGE */

.hero{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    text-align:center;

    padding:40px;


    background:

    linear-gradient(
    rgba(0,0,0,.55),
    rgba(0,0,0,.85)
    ),

    url("pinkboy-cover.jpg");


    background-size:cover;

    background-position:center;

    background-attachment:fixed;

}



.logo{

    font-size:90px;

    font-weight:900;

    letter-spacing:-5px;

    margin:0;

}



.archive{

    margin-top:20px;

    font-size:18px;

    letter-spacing:12px;

    color:#cfcfcf;

}



button{


    margin-top:60px;

    padding:16px 55px;


    border:1px solid white;

    border-radius:0;


    background:transparent;

    color:white;


    font-size:16px;


    letter-spacing:5px;


    cursor:pointer;


    transition:.3s;

}



button:hover{

    background:white;

    color:black;

}



/* SAMPLE ARCHIVE SECTION */


.packs{


    padding:90px 10%;

    text-align:center;


}



.packs h2{


    font-size:45px;

    margin-bottom:50px;


}



.container{


    display:flex;

    justify-content:center;

    flex-wrap:wrap;

    gap:35px;


}



.card{


    width:330px;


    background:#101010;


    padding:25px;


    border-radius:15px;


    text-align:left;


    border:1px solid #222;


    transition:.3s;


}



.card:hover{

    transform:translateY(-8px);

    border-color:#555;

}



.cover{


    height:230px;


    background:#1a1a1a;


    border-radius:10px;


    margin-bottom:25px;


}



.card h3{


    font-size:24px;


    line-height:1.3;


}



.card p{


    color:#888;


    line-height:1.6;


}



.price{


    margin-top:20px;


    font-size:22px;


    font-weight:bold;


}



/* FOOTER */


footer{


    text-align:center;


    padding:40px;


    color:#555;


}




/* MOBILE */


@media(max-width:700px){


.logo{

    font-size:55px;

}


.archive{

    font-size:12px;

    letter-spacing:6px;

}


}


</style>


</head>



<body>

<div>

</body>

</html>
